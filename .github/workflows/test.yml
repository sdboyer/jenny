name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # Release binaries are built with go1.26, which refuses go1.27 modules.
          install-mode: goinstall
          # Warm-cache runs fail to import export data for packages with
          # generic methods (Go 1.27): "internal error in importing ... (assertion failed)".
          skip-cache: true
