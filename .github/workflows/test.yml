name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows default to case-insensitive filesystems, which
        # FS.Write targets and Files.Validate's conflict rules exist for.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      # jennylint is a module of its own, so the steps above don't reach it.
      - run: go mod tidy -diff
        working-directory: jennylint
      - run: go mod tidy -diff
        working-directory: jennylint/testdata
      - run: go vet ./...
        working-directory: jennylint
      - run: go test -race ./...
        working-directory: jennylint
      # jenny's own examples and tests follow the rule jennylint checks, and
      # this runs it the way the docs tell users to.
      - name: go vet -vettool=jennylint
        shell: bash
        run: |
          (cd jennylint && go install ./cmd/jennylint)
          go vet -vettool="$(go env GOPATH)/bin/jennylint$(go env GOEXE)" ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Release binaries are built with go1.26, which refuses go1.27 modules.
          install-mode: goinstall
          # Warm-cache runs fail to import export data for packages with
          # generic methods (Go 1.27): "internal error in importing ... (assertion failed)".
          skip-cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          skip-cache: true
          working-directory: jennylint
